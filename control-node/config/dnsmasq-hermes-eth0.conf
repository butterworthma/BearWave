# BearWave private Ethernet link for the Hermes-Lite SDR.
#
# The control-node Pi keeps WLAN for operator/admin access and uses eth0 as a
# direct, standalone control link to the Hermes-Lite. dnsmasq is used only as a
# DHCP server here; DNS is disabled with port=0 so this cannot interfere with
# the normal WLAN network.

interface=eth0
bind-dynamic
port=0
dhcp-authoritative

# Pi eth0 is statically configured as 192.168.50.1/24. The small dynamic range
# is only for bench tools; the Hermes-Lite itself is pinned below by MAC.
dhcp-range=192.168.50.80,192.168.50.90,255.255.255.0,12h

# Hermes-Lite currently seen on WLAN/LAN as 192.168.1.85 with MAC
# 00:1c:c0:a2:13:dd. Give it the same private Ethernet address every time.
dhcp-host=00:1c:c0:a2:13:dd,192.168.50.85,infinite
